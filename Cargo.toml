[package]
name = "needle-rdf-agent"
version = "0.1.0"
edition = "2021"
description = "Needle 3 RDF/OWL agent — Phase 1: authoritative Oxigraph knowledge store behind a stable trait"
license = "MIT"

[[bin]]
name = "needle-rdf-agent"
path = "src/main.rs"

[lib]
name = "needle_rdf_agent"
path = "src/lib.rs"

[dependencies]
oxigraph = { version = "0.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[profile.dev]
opt-level = 0
